name: JARVIS C005 isolated assurance
on:
  push:
    branches:
      - sandbox/jarvis-operational-gates-c005-20261015
  pull_request:
    paths:
      - 'labs/jasap_c005/**'
      - '.github/workflows/jarvis-c005-isolated-assurance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: labs/jasap_c005
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: labs/jasap_c005/requirements-lab.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-lab.txt
      - name: Run isolated tests
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p evidence
          python -m unittest discover -s tests -v 2>&1 | tee evidence/ci_test_results.txt
      - name: Ensure no production GxP authority
        run: |
          grep -q '"gxp_approval":"NOT_GRANTED"' trust_anchor/core.py || grep -q '"gxp_approval": "NOT_GRANTED"' trust_anchor/core.py || grep -q "'gxp_approval':'NOT_GRANTED'" trust_anchor/core.py || grep -q '"gxp_approval":"NOT_GRANTED"' trust_anchor/cloud_adapter.py || (echo "Review GxP guard manually"; exit 1)
      - name: Upload test record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-c005-tests
          path: labs/jasap_c005/evidence/ci_test_results.txt
          if-no-files-found: warn
