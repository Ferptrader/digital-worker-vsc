# JARVIS-HYB-F2-001 Rev00 — somente SIM-EMS sintético, revisão pendente.
# Sem schedule/push/PR; não instalado no GitHub nesta etapa.
name: JARVIS HYB MVP001 - verificacao manual isolada

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-hyb-mvp-001-manual
  cancel-in-progress: false

jobs:
  verificar-sim-ems:
    name: Python offline / SIM-EMS / SEM AUTORIDADE GxP
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_INDEX: '1'
    defaults:
      run:
        shell: bash
        working-directory: labs/jarvis_hyb_mvp_001
    steps:
      - name: Checkout com credenciais não persistentes
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Configurar Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Executar 20 testes unitários (somente biblioteca padrão)
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m unittest discover -s tests -v 2>&1 | tee reports/tests.log
      - name: Verificar estrutura SIM-EMS e emitir arquivos
        run: |
          set -euo pipefail
          python -m jarvis_hyb verify --fixture-dir fixtures --output-dir reports/clean 2>&1 | tee reports/clean_stdout.txt
      - name: Teste adversarial (exportação alterada DEVE falhar)
        run: |
          set -euo pipefail
          set +e
          python -m jarvis_hyb verify --fixture-dir fixtures --candidate-csv examples/exportacao_alterada_demo.csv --output-dir reports/negative > reports/negative_stdout.txt 2>&1
          result=$?
          set -e
          echo "NEGATIVE_EXIT_CODE=$result" | tee reports/negative_exit_code.txt
          test "$result" -eq 1
      - name: Atestar hashes, resultados e bloqueios GxP
        run: |
          set -euo pipefail
          python ci_assert.py reports 2>&1 | tee reports/ci_assertions.log
          cat reports/ci_summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Arquivar somente relatórios sintéticos (3 dias)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jarvis-hyb-sim-ems-${{ github.run_id }}-${{ github.run_attempt }}
          path: labs/jarvis_hyb_mvp_001/reports/
          retention-days: 3
          if-no-files-found: warn
