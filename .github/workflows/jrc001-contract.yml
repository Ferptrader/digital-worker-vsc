name: JRC-001 Baseline and Authority Boundary
on:
  push:
    branches: [sandbox/jarvis-remote-candidate-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate contract invariants
        run: python -m jrc001.test_contract
      - name: Retain machine-readable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrc001-contract-receipt
          path: jrc001_contract_receipt.json
          if-no-files-found: warn
